apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: madfam-site
  project: madfam-site
spec:
  # status.madfam.io tracking — pre-existing entry was hand-added on the
  # platform configmap before the zero-touch model. Declared here so
  # `POST /v1/admin/status/regenerate` keeps it on the page. See Phase 2
  # follow-up backfill 2026-04-27.
  status:
    enabled: true
    entries:
      - name: MADFAM Website
        url: https://madfam.io
        href: https://madfam.io
        group: MADFAM Site
        family: MADFAM Corporate
        description: Corporate website
  runtime:
    port: 3000
  # domains: intentionally NOT declared here — REMOVED 2026-08-27.
  # This doc's metadata.name is `madfam-site`, but no cluster Service of that
  # name exists (the real one is madfam-web; madfam-cms was retired 2026-09-23, R52). Declaring
  # domains here invites the platform's domain reconciler to derive tunnel
  # routes to `madfam-site.madfam-site.svc` — a dead backend — exactly the
  # mechanism of the 2026-08-27 janua identity outage (that repo's block
  # captured madfam.io first, which is why the outage owned these hostnames).
  # Correct bindings, held in the switchyard registry: madfam.io + www →
  # madfam-web · docs.madfam.io → janua-docs (historical placement).
  network:
    services:
      - name: madfam-web
        port: 3000
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
