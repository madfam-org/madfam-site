name: Security Audit

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security audit on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    name: Security Vulnerability Audit
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run security audit (Critical only)
        run: |
          echo "🔒 Checking for CRITICAL vulnerabilities..."
          pnpm audit --json > audit-results.json || true

          CRITICAL_COUNT=$(node -e "const data = require('./audit-results.json'); console.log(data.metadata?.vulnerabilities?.critical || 0)")

          if [ "$CRITICAL_COUNT" -eq 0 ]; then
            echo "✅ No critical vulnerabilities found"
          else
            echo "❌ CRITICAL vulnerabilities detected: $CRITICAL_COUNT"
            cat audit-results.json
            exit 1
          fi
          
      - name: Run security audit (All levels)
        run: |
          echo "🔍 Full security audit report..."
          pnpm audit --audit-level low || true
          
      - name: Check for security best practices
        run: |
          echo "🛡️ Checking security configuration..."
          
          # Check for security headers in middleware
          if grep -r "X-Frame-Options\|X-Content-Type-Options\|Referrer-Policy" apps/web/middleware.ts > /dev/null; then
            echo "✅ Security headers configured"
          else
            echo "⚠️ Security headers might be missing"
          fi
          
          # Check for input validation
          if grep -r "zod\|z\." apps/web/app/api/ > /dev/null; then
            echo "✅ Input validation found in API routes"
          else
            echo "⚠️ Input validation might be missing in API routes"
          fi
          
          # Check for rate limiting
          if grep -r "rate-limit\|rateLimit" apps/web/ > /dev/null; then
            echo "✅ Rate limiting implementation found"
          else
            echo "⚠️ Rate limiting might be missing"
          fi
          
      - name: Application security check
        run: pnpm --filter @madfam/web test:security

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-results
          path: |
            audit-*.json
            security-report.json
          retention-days: 30