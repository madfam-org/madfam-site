name: Registry Freshness

# Boundary checkpoint (2026-09-23, madfam-site): compares two PUBLIC copies of
# the product-registry projection (this repo's and solarpunk-foundry's). No
# private repo is read and no secret is used. Policy:
# internal-devops/docs/repo-boundary-contract.md.
#
# Finding C-028 / audit Phase 4 "vendored-copy freshness": `check:platforms`
# only proves the generated catalog matches the vendored projection, not that
# the vendored projection is current. This weekly job fails when this site's
# copy is older than the foundry's, and opens (or updates) an issue so the
# failure is seen rather than sitting in the Actions tab.

on:
  schedule:
    - cron: '17 14 * * 1' # Mondays 14:17 UTC (08:17 CDMX)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    name: Vendored projection freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Compare vendored projection with the foundry copy
        id: check
        run: node scripts/check-projection-freshness.mjs

      - name: Open or update the drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Vendored registry projection is stale"
          body="The weekly Registry Freshness job failed: ${RUN_URL}. Re-vendor apps/web/lib/data/projection.public.json from the registry (see AGENTS.md) and run pnpm generate:platforms."
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
