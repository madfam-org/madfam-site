name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  HUSKY: 0
  CI: true

jobs:
  quality-checks:
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd apps/web
          npx prisma generate || echo "Prisma generation failed - continuing without client"
        env:
          SKIP_ENV_VALIDATION: true
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      # Type Checking
      - name: Type Check
        run: pnpm run typecheck

      # Linting
      - name: ESLint
        run: pnpm run lint

      # Build Check
      - name: Build Check
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: true
          NODE_ENV: production

      # Production dependency advisories, report-only: the high backlog is
      # tracked in batch S6. The outcome is written to the job summary instead
      # of being swallowed by `|| true` (finding S1-005). Critical advisories
      # fail CI's "Security Audit" job (scripts/security-check.js).
      - name: Production dependency audit (advisory)
        id: audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      # Testing ("--" is required so pnpm/turbo pass --run through to vitest)
      - name: Run Tests
        run: pnpm run test -- --run

      # Bundle budgets (blocking): shared chunks, route chunks and CSS, gzip,
      # measured against this build. See .bundlewatch.config.js (S1-004).
      - name: Bundle Size Analysis
        run: pnpm exec bundlewatch --config .bundlewatch.config.js

      - name: Summarize advisory checks
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          {
            echo "### Advisory checks"
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Production dependency audit (high+) | ${AUDIT} |"
            echo
            echo "Advisory checks do not fail this job; a \`failure\` here is a real finding, not noise."
          } >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: 'trivy-results.sarif'
