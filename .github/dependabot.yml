version: 2

# ---------------------------------------------------------------------------
# THIS IS A SINGLE-LOCKFILE pnpm WORKSPACE.
#
# There is exactly one lockfile — `/pnpm-lock.yaml` — and it covers every
# workspace member listed in `pnpm-workspace.yaml` (`apps/*`, `packages/*`).
#
# Therefore there must be exactly ONE npm update config, rooted at "/".
#
# Do NOT add per-directory configs (e.g. directory: "/apps/web"). Dependabot
# treats each such directory as an independent project: it finds only that
# directory's package.json, and — because no lockfile lives there — it updates
# the manifest and NEVER touches the root pnpm-lock.yaml. The resulting PR is
# born broken and can never go green, because CI, Quality Gates, Security Audit
# and PR Checks all begin with `pnpm install --frozen-lockfile`, which fails
# with ERR_PNPM_OUTDATED_LOCKFILE the moment a manifest and the lockfile
# disagree. Four red workflows, every time, forever.
#
# The root config below is proven to handle the whole workspace correctly: it
# updates apps/cms, apps/web, packages/* AND pnpm-lock.yaml in a single PR.
#
# A second consequence of per-directory configs: they do not inherit the
# `ignore` rules below, so major bumps this repo has explicitly opted out of
# (next, react, react-dom) get raised anyway.
# ---------------------------------------------------------------------------

updates:
  # npm — the entire pnpm workspace, from the root (the only lockfile).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "madfam-org/developers"
    assignees:
      - "madfam-org/developers"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Major upgrades for these are deliberate, coordinated migrations
      # (React 19 + Turbopack + middleware→proxy), not dependency bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Coordinated majors (issue #261; finding S1-013, batch S7). Each of these
      # was raised, went red or planted an inconsistent lockfile, was closed
      # and was raised again (#267-#269 -> #320, #322, #323):
      #   - prisma + @prisma/client must move together (Prisma 7 driver-adapter
      #     and config model; Prisma runs in the web API routes),
      #   - vite 8 + @vitejs/plugin-react 6 + vitest move together, and the
      #     root `overrides.vite` pin has to change with them,
      #   - zod 4 and typescript majors touch every schema / type surface.
      # They arrive as owned migration PRs, not as Dependabot bumps.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # One group for every non-major update across the workspace. A previous
    # `dev-dependencies` group was removed: it also used `patterns: ["*"]`, and
    # since a dependency joins the FIRST group it matches, it never captured
    # anything — `dependencies` already covers dev deps (see PR #263, which
    # grouped all 25 updates, prod and dev alike, under `dependencies`).
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
