---
# Secret key template for reference - DO NOT commit real or base64 values.
# Preferred path: manage actual values through Enclii secrets backed by
# Lockbox/Vault/ESO.
#
# Direct kubectl secret mutation is bootstrap/break-glass only when Enclii is
# unavailable or missing an adapter. Record the reason and reconcile values back
# into the secret store afterward.
#
# Boundary checkpoint (2026-09-23, madfam-site): key NAMES only, never values;
# public sink. Policy: internal-devops/docs/repo-boundary-contract.md.
#
# Keys the web app validates at start (apps/web/lib/env.ts): DATABASE_URL,
# ENCRYPTION_KEY, API_SECRET; optional service keys are listed in
# apps/web/.env.example.
# Retired 2026-09-23 — no code reads them any more; remove from the live Secret:
#   NEXTAUTH_SECRET, NEXTAUTH_URL, JANUA_CLIENT_ID, JANUA_SECRET (ruling R42,
#   finding C-003: no sign-in surface, no HS256 Janua verification) and
#   PAYLOAD_SECRET (ruling R52: madfam-cms retired).
apiVersion: v1
kind: Secret
metadata:
  name: madfam-site-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Replace=false
  labels:
    app.kubernetes.io/part-of: madfam-platform
    enclii.dev/managed-by: switchyard
type: Opaque
# data populated by Enclii/Vault/ESO; NOT managed by ArgoCD
