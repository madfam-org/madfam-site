# Boundary checkpoint (2026-11-15, madfam-site): public-safe manifest shape only.
# It names a store, a path and a property; it holds no secret value. Policy:
# AGENTS.md "Value-free secret mappings".
#
# Signing key for the contact form's lead delivery to the CRM
# (apps/web/lib/phynd-crm.ts). The CRM verifies the signature, so this key must
# equal the CRM's own copy; the platform's secret intake generates one value
# and writes it to every holder.
#
# A DEDICATED target Secret on purpose: with creationPolicy Owner, the operator
# parks the whole target Secret while a mapped property is missing, so this key
# must never share madfam-site-secrets. Until the property is provisioned this
# Secret is absent; the Deployment references it with optional: true, so the
# pod starts without it and no lead is delivered (the form itself still works).
#
# No sync-wave annotation on purpose: it syncs in the same wave as the
# Deployment, so an unprovisioned mapping cannot hold back an earlier wave.
#
# Activation: provision the value through the platform's secret intake, wait
# for the sync (15m) and restart the web Deployment (env is read at start).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: madfam-site-phynd-crm-lead-intake
  namespace: madfam-site
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: madfam-site-phynd-crm-lead-intake
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PHYND_CRM_LEAD_INTAKE_SECRET
      remoteRef:
        key: secret/madfam-site
        property: phynd_crm_lead_intake_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
